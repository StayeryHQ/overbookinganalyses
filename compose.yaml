services:
  app:
    hostname: overbooking-analysis
    image: ghcr.io/stayeryhq/overbookinganalyses:${APP_IMAGE_TAG}
    networks:
      - streamlit
      - traefik-public
    secrets:
      - bigquery_secret
    volumes:
      - streamlit_data:/app/data
    environment:
      - GCP_SERVICE_ACCOUNT_JSON_FILE=/run/secrets/bigquery_secret
      # Dash-native env vars for path prefixing behind Traefik.
      # DASH_ROUTES_PATHNAME_PREFIX stays at "/" because Traefik strips the
      # public prefix before forwarding. DASH_REQUESTS_PATHNAME_PREFIX tells
      # Dash to emit asset URLs and dcc.Link hrefs prefixed with the public
      # path so the browser reaches Traefik at the correct routed endpoint.
      # These map 1:1 to Dash constructor kwargs and don't collide like
      # the deprecated DASH_URL_BASE_PATHNAME (which maps to url_base_pathname).
      - DASH_ROUTES_PATHNAME_PREFIX=/
      - DASH_REQUESTS_PATHNAME_PREFIX=/_carogician/
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      # Service configuration
      - traefik.http.services.overbooking-analysis.loadbalancer.server.port=8050

      # Router for /overbooking-analysis path
      - traefik.http.routers.overbooking-analysis-https.rule=Host(`stayomat.de`) && PathPrefix(`/_carogician`)
      - traefik.http.routers.overbooking-analysis-https.entrypoints=https
      - traefik.http.routers.overbooking-analysis-https.tls=true
      - traefik.http.routers.overbooking-analysis-https.tls.certresolver=le

      # ForwardAuth middleware to check authentication
      - traefik.http.middlewares.overbooking-auth.forwardauth.address=http://stayomat_web:6000/api/forward-auth/streamlit
      - traefik.http.middlewares.overbooking-auth.forwardauth.authResponseHeaders=X-User-Id
      - traefik.http.middlewares.overbooking-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.overbooking-auth.forwardauth.authRequestHeaders=Cookie

      # Strip /overbooking-analysis prefix before forwarding to Streamlit
      - traefik.http.middlewares.overbooking-stripprefix.stripprefix.prefixes=/_carogician

      # Apply middlewares
      - traefik.http.routers.overbooking-analysis-https.middlewares=overbooking-auth,overbooking-stripprefix

networks:
  streamlit:
    external: true
  traefik-public:
    external: true

secrets:
  bigquery_secret:
    external: true

volumes:
  streamlit_data:
