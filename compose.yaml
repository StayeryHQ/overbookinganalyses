services:
  app:
    hostname: overbooking-analysis
    image: ghcr.io/stayeryhq/overbookinganalyses:${APP_IMAGE_TAG}
    networks:
      - streamlit
      - traefik-public
    secrets:
      - bigquery_secret
    volumes:
      - streamlit_data:/app/data
    environment:
      - GCP_SERVICE_ACCOUNT_JSON_FILE=/run/secrets/bigquery_secret
      # Traefik forwards the full /_carogician/ path (no strip) so Dash must
      # serve both routes and assets under /_carogician/. DASH_URL_BASE_PATHNAME
      # sets routes_pathname_prefix + requests_pathname_prefix to the same value
      # — exactly what we need. Safe because the Dash constructor no longer
      # passes explicit prefix kwargs (which would collide with this env var).
      - DASH_URL_BASE_PATHNAME=/_carogician/
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      # Service configuration
      - traefik.http.services.overbooking-analysis.loadbalancer.server.port=8050

      # Router for /overbooking-analysis path
      - traefik.http.routers.overbooking-analysis-https.rule=Host(`stayomat.de`) && PathPrefix(`/_carogician`)
      - traefik.http.routers.overbooking-analysis-https.entrypoints=https
      - traefik.http.routers.overbooking-analysis-https.tls=true
      - traefik.http.routers.overbooking-analysis-https.tls.certresolver=le

      # ForwardAuth middleware to check authentication
      - traefik.http.middlewares.overbooking-auth.forwardauth.address=http://stayomat_web:6000/api/forward-auth/streamlit
      - traefik.http.middlewares.overbooking-auth.forwardauth.authResponseHeaders=X-User-Id
      - traefik.http.middlewares.overbooking-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.overbooking-auth.forwardauth.authRequestHeaders=Cookie

      # Apply middlewares (no stripprefix — Dash serves under /_carogician/ natively)
      - traefik.http.routers.overbooking-analysis-https.middlewares=overbooking-auth

networks:
  streamlit:
    external: true
  traefik-public:
    external: true

secrets:
  bigquery_secret:
    external: true

volumes:
  streamlit_data:
