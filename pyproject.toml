[project]
name = "overbooking-analyse"
version = "0.1.0"
description = "Cancellation prediction + overbooking dashboards for Stayery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # core data + plotting
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.11",   # imported directly (overbooking._norm_ppf, HP search)
    "joblib>=1.4.2",
    # BigQuery loader (storage API = much faster than REST fallback)
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-storage>=2.27.0",
    "db-dtypes>=1.3.0",
    # models
    "xgboost>=2.1.1",
    # hyperparameter search (unified TPE search in src.hp_search)
    "optuna>=4.0.0",
    # notebooks + interactive dashboards
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    # explainability (optional but referenced in 02-04)
    "shap>=0.45.0",
    # optional: streamlit kept since you may switch dashboards to a webapp later
    "streamlit>=1.57.0",
    "rapidfuzz>=3.14.5",
    "scikit-survival>=0.27.0",
    "lifelines>=0.30.0",
    "plotly>=6.8.0",
    # notebook plotting (src.utils.apply_stayery_style); the Dash app uses plotly, not this
    "matplotlib>=3.8",
    "dash[diskcache]>=4.3.0",
    "flask>=3.1.3",
    "importlib-metadata>=9.0.0",
    "janus>=2.0.0",
    "retrying>=1.4.2",
    "werkzeug>=3.1.8",
    "zipp>=4.1.0",
    "jinja2>=3.1.6",
    "numba>=0.59.0",
    "dash-ag-grid>=35.2.0",
    "dash-mantine-components>=2.8.0",
    "diskcache>=5.6.3",
    "openpyxl>=3.1.5",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]


[tool.uv]
override-dependencies = [
    "nvidia-nccl-cu12; sys_platform == 'never'",
]
