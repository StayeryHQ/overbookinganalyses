# =============================================================================
# Brand Configuration
# =============================================================================

colors: # this is a nested dictionary defining the color palette for the brand, organized into core and supporting colors.
  core:
    black:  "#000000"   # Text on light backgrounds
    white:  "#FFFFFF"   # Default chart background
    yellow: "#FFE650"   # Brand-defining accent
  supporting:
    pink:   "#F0B4C8"
    green:  "#08A064"
    orange: "#EB6E14"
    red:    "#E62828"
    blue:   "#1E4BA1"
    purple: "#6E32C8"

# Order in which colors are assigned to chart series.
categorical_order:
  - yellow
  - blue
  - green
  - orange
  - pink
  - purple

# Sequential palette anchor
sequential_anchor: yellow

# Diverging palette 
diverging:
  negative: red
  neutral:  white
  positive: green

typography:
  primary: "Neue Haas Grotesk Display Pro"
  primary_fallback:
    - "Neue Haas Grotesk"
    - "NeueHaasGroteskTextPro"
    - "Inter"
    - "Helvetica Neue"
    - "Helvetica"
    - "Arial"
    - "sans-serif"

  # Display font for occasional emphasis (titles, callouts).
  display: "Topol"
  display_fallback:
    - "Topol"
    - "Inter"
    - "sans-serif"
