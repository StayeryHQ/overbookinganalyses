# =============================================================================
# Risk-bucket thresholds for the booking table's "Risk" column.
# =============================================================================
# Maps a predicted cancellation probability p to a label:
#     p < low_max            -> Low
#     low_max <= p < high_min -> Medium
#     p >= high_min          -> High
#
# Make sure to replace them with what is needed by the revenue manager
low_max: 0.20
high_min: 0.70

labels:
  low: "Low"
  medium: "Medium"
  high: "High"
