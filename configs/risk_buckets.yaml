# =============================================================================
# Risk-bucket configuration for the booking table's "Risk" column.
# =============================================================================
# The Low / Medium / High buckets follow ONE cost-based rule:
#     p <  threshold               -> Low
#     threshold <= p < high_cutoff -> Medium
#     p >= high_cutoff             -> High   (always, independent of the threshold)
#
# `threshold` is the cost-optimal DECISION threshold and is NOT a config value —
# it moves with the walk/empty costs entered in the app (Occupancy & Predictions).
# Only the fixed High cutoff and the display labels live here.
high_cutoff: 0.85

labels:
  low: "Low"
  medium: "Medium"
  high: "High"
